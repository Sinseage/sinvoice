name: Сборка SINVoice

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Версия из тега релиза
        if: github.event_name == 'release'
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          npm version "$V" --no-git-tag-version --allow-same-version

      - name: Установка зависимостей
        run: npm install --no-audit --no-fund

      - name: Сборка exe
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Сохранить как артефакт
        if: github.event_name != 'release'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: SINVoice
          path: dist/*.exe
          retention-days: 1

      - name: Приложить exe к релизу
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
